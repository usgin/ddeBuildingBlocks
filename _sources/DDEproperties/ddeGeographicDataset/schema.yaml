---
$schema: https://json-schema.org/draft/2020-12/schema
title: DDE Geographic Dataset properties
description: Conditional extension for geographic dataset resources. Implements
  MD_SpatialRepresentation entity (DDE spec Table 5) with spatialCoverage (mandatory),
  spatialRepresentationType (SpatialRepresentationTypeCode enum),
  spatialResolution (string), referenceSystemType (ReferenceSystemTypeCode enum),
  referenceSystemIdentifier (MD_Identifier pattern), and verticalExtent
  (EX_VerticalExtent - minimum and maximum value, units, vertical CRS).
type: object
properties:
  'schema:spatialCoverage':
    description: Spatial extent of the geographic dataset. Mandatory for geographicDataset
      resource type.
    type: array
    items:
      $ref: '#/$defs/SpatialExtent'
    minItems: 1
  'schema:additionalProperty':
    type: array
    description: Spatial representation properties using DDE propertyIDs.
      Each item is a PropertyValue with a DDE propertyID and a value whose type
      depends on the property.
    items:
      anyOf:
      - $ref: '#/$defs/SpatialRepresentationTypePV'
      - $ref: '#/$defs/SpatialResolutionPV'
      - $ref: '#/$defs/ReferenceSystemTypePV'
      - $ref: '#/$defs/ReferenceSystemIdentifierPV'
      - $ref: '#/$defs/VerticalExtentPV'
      - $ref: '#/$defs/AdditionalProperty'
      if:
        type: object
        properties:
          'schema:propertyID':
            type: array
            contains:
              $ref: '#/$defs/VerticalExtentID'
        required:
        - 'schema:propertyID'
      then:
        $ref: '#/$defs/VerticalExtentPV'
required:
- 'schema:spatialCoverage'
$defs:
  SpatialExtent:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/spatialExtent/schema.yaml
  AdditionalProperty:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/additionalProperty/schema.yaml
  Identifier:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/identifier/schema.yaml
  SpatialRepresentationTypePV:
    type: object
    description: Method used to represent geographic information in the resource.
      Value from SpatialRepresentationTypeCode (XSD).
    properties:
      '@type':
        const: schema:PropertyValue
      'schema:propertyID':
        type: array
        contains:
          const: 'dde:spatialRepresentationType'
        minItems: 1
      'schema:name':
        type: string
      'schema:value':
        type: string
        enum:
        - vector
        - grid
        - textTable
        - tin
        - stereoModel
        - video
    required:
    - 'schema:propertyID'
    - 'schema:name'
    - 'schema:value'
  SpatialResolutionPV:
    type: object
    description: Spatial resolution of the dataset (free text, e.g. "1:1000000",
      "30m"). Value is a string (CharacterString_Type in XSD).
    properties:
      '@type':
        const: schema:PropertyValue
      'schema:propertyID':
        type: array
        contains:
          const: 'dde:spatialResolution'
        minItems: 1
      'schema:name':
        type: string
      'schema:value':
        type: string
    required:
    - 'schema:propertyID'
    - 'schema:name'
    - 'schema:value'
  ReferenceSystemTypePV:
    type: object
    description: Type of coordinate reference system. Value from
      ReferenceSystemTypeCode (XSD, 28 values).
    properties:
      '@type':
        const: schema:PropertyValue
      'schema:propertyID':
        type: array
        contains:
          const: 'dde:referenceSystemType'
        minItems: 1
      'schema:name':
        type: string
      'schema:value':
        type: string
        enum:
        - compoundEngineeringParametric
        - compoundEngineeringParametricTemporal
        - compoundEngineeringTemporal
        - compoundEngineeringVertical
        - compoundEngineeringVerticalTemporal
        - compoundGeographic2DParametric
        - compoundGeographic2DParametricTemporal
        - compoundGeographic2DTemporal
        - compoundGeographic2DVertical
        - compoundGeographicVerticalTemporal
        - compoundGeographic3DTemporal
        - compoundProjected2DParametric
        - compoundProjected2DParametricTemporal
        - compoundProjectedTemporal
        - compoundProjectedVertical
        - compoundProjectedVerticalTemporal
        - engineering
        - engineeringDesign
        - engineeringImage
        - geodeticGeocentric
        - geodeticGeographic2D
        - geodeticGeographic3D
        - geographicIdentifier
        - linear
        - parametric
        - projected
        - temporal
        - vertical
    required:
    - 'schema:propertyID'
    - 'schema:name'
    - 'schema:value'
  ReferenceSystemIdentifierPV:
    type: object
    description: Identifier for the coordinate reference system. Follows the
      MD_Identifier pattern from the XSD (code + optional codeSpace, version, url).
      Value is the identifier code string (e.g. "EPSG:4326"), with optional
      schema:url for the resolvable form.
    properties:
      '@type':
        const: schema:PropertyValue
      'schema:propertyID':
        type: array
        contains:
          const: 'dde:referenceSystemIdentifier'
        minItems: 1
      'schema:name':
        type: string
      'schema:value':
        type: string
        description: The reference system identifier code (e.g. "EPSG:4326",
          "urn:ogc:def:crs:EPSG::4326").
      'schema:url':
        type: string
        format: uri
        description: Resolvable URL for the reference system identifier
          (e.g. "https://epsg.io/4326").
    allOf:
    - required:
      - 'schema:propertyID'
      - 'schema:name'
    - anyOf:
      - required:
        - 'schema:value'
      - required:
        - 'schema:url'
  VerticalExtentID:
    description: The dde:verticalExtent propertyID, as a string or an @id reference.
    anyOf:
    - const: 'dde:verticalExtent'
    - type: object
      properties:
        '@id':
          const: 'dde:verticalExtent'
      required:
      - '@id'
  VerticalExtentPV:
    type: object
    description: Vertical extent of the dataset (ISO 19115-3 EX_VerticalExtent; DDE
      elevation). schema:value is a schema:QuantitativeValue whose schema:minValue
      and schema:maxValue are the lowest and highest vertical coordinates, in the
      unit of its schema:unitCode (UCUM, e.g. "m"). schema:valueReference names the
      vertical coordinate reference system. Depths below a datum are negative values
      in a height CRS, or positive values in a depth CRS such as EPSG:5715. Give at
      least one bound; an open-ended range gives only the other. A PropertyValue
      whose propertyID is dde:verticalExtent must have this shape.
    properties:
      '@type':
        type: array
        items:
          type: string
        contains:
          const: schema:PropertyValue
      'schema:propertyID':
        type: array
        contains:
          $ref: '#/$defs/VerticalExtentID'
        minItems: 1
      'schema:name':
        type: string
      'schema:value':
        type: object
        description: The vertical range.
        properties:
          '@type':
            type: array
            items:
              type: string
            contains:
              const: schema:QuantitativeValue
          'schema:minValue':
            type: number
            description: Lowest vertical coordinate (EX_VerticalExtent/minimumValue).
          'schema:maxValue':
            type: number
            description: Highest vertical coordinate (EX_VerticalExtent/maximumValue).
          'schema:unitCode':
            type: string
            description: Unit of the bounds, as a UCUM code (e.g. "m", "km", "[ft_i]").
          'schema:unitText':
            type: string
            description: Unit of the bounds as text, where there is no code.
        allOf:
        - required:
          - '@type'
        - anyOf:
          - required:
            - 'schema:minValue'
          - required:
            - 'schema:maxValue'
      'schema:valueReference':
        type: object
        description: The vertical coordinate reference system
          (EX_VerticalExtent/verticalCRSId), as a DefinedTerm whose termCode is the
          identifier code (e.g. "EPSG:5714") and whose schema:url is its resolvable
          form.
        properties:
          '@type':
            type: array
            items:
              type: string
            contains:
              const: schema:DefinedTerm
          'schema:name':
            type: string
          'schema:termCode':
            type: string
          'schema:url':
            type: string
            format: uri
        anyOf:
        - required:
          - 'schema:termCode'
        - required:
          - 'schema:url'
    required:
    - 'schema:propertyID'
    - 'schema:name'
    - 'schema:value'
