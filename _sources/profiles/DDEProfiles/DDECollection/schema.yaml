---
$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: DDE Collection profile
description: >-
  DDE profile for collection resources (aggregate, collection, series,
  learningResource, guide). Composes ddeCore with the CDIF manifest profile and
  adds the DDE-specific constraints: the collection's own resource type, a DDE
  resource type on every member, and a temporal extent.

  schema:hasPart comes from cdifManifest, so a member carries that profile's
  resourcePartItem shape -- @id, @type, schema:name, schema:description,
  schema:encodingFormat, schema:url, schema:about -- and a DDE resource type in
  addition, the two composing through the allOf below. Before this the block
  defined its own member shape with no way to say where a member could be
  retrieved, which is the one thing a manifest exists to express.

  Three conformance URIs land on the catalog record, each a separate
  "contains" over the same dcterms:conformsTo array: cdif/core/1.1 from
  cdifCore, cdif/manifest/1.1 from cdifManifest, and this profile's own
  cdif/dde/1.0/DDECollection. Manifest conformance is against 1.1, matching
  what this repository vendors. Nothing here restates that the array is
  required -- cdifCore requires schema:subjectOf and cdifCatalogRecord requires
  dcterms:conformsTo, so a branch doing that by hand was removed 2026-11-15.
allOf:
- $ref: ../../../DDEproperties/ddeCore/schema.yaml
# Conformance URI for this profile. DDE profiles are the schemas that
# document instances claim conformance to, so the URI belongs here rather
# than on a property building block. Placement follows the CDIF profile
# modules (cdifCore, cdifManifest, cdifProvenance): a bare "contains" over
# schema:subjectOf/dcterms:conformsTo. Nothing else is restated, because
# cdifCore already requires schema:subjectOf and cdifCatalogRecord already
# requires dcterms:conformsTo and types its items as objectReference.
- properties:
    'schema:subjectOf':
      properties:
        'dcterms:conformsTo':
          contains:
            type: object
            required: ['@id']
            additionalProperties: false
            properties:
              '@id':
                const: 'https://w3id.org/cdif/dde/1.0/DDECollection'
- $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/profiles/cdifProfile/cdifManifest/schema.yaml
- properties:
    'schema:additionalType':
      contains:
        type: object
        properties:
          '@type':
            contains:
              const: schema:DefinedTerm
          'schema:inDefinedTermSet':
            const: 'dde:codelist/ResourceTypeCode'
          'schema:termCode':
            type: string
            enum:
            - aggregate
            - collection
            - series
            - learningResource
            - guide
        required:
        - '@type'
        - 'schema:inDefinedTermSet'
        - 'schema:termCode'
      minContains: 1
    'schema:hasPart':
      type: array
      description: >-
        Members of the collection. The item shape comes from cdifManifest's
        resourcePartItem via the allOf above; this branch adds the DDE resource
        type every member must carry. items, not contains: each member is
        classified, not merely one of them.
      minItems: 1
      items:
        $ref: ../../../DDEproperties/ddeResourceType/schema.yaml
    'schema:temporalCoverage':
      description: Temporal extent of resource content.
      type: array
      items:
        $ref: '#/$defs/TemporalExtent'
  required:
  - 'schema:hasPart'
$defs:
  TemporalExtent:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/temporalExtent/schema.yaml
