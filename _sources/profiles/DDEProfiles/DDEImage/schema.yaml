$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: DDE Image profile
description: DDE profile for image resources (image, photograph, explanatoryFigure, map). Extends ddeCore
  with resource type constraint and ddeImagery properties. If additionalType termCode is map, ddeGeographicDataset
  constraints are also applied.
allOf:
- $ref: ../../../DDEproperties/ddeCore/schema.yaml
# Conformance URI for this profile. DDE profiles are the schemas that
# document instances claim conformance to, so the URI belongs here rather
# than on a property building block. Placement follows the CDIF profile
# modules (cdifCore, cdifManifest, cdifProvenance): a bare "contains" over
# schema:subjectOf/dcterms:conformsTo. Nothing else is restated, because
# cdifCore already requires schema:subjectOf and cdifCatalogRecord already
# requires dcterms:conformsTo and types its items as objectReference.
- properties:
    'schema:subjectOf':
      properties:
        'dcterms:conformsTo':
          contains:
            type: object
            required: ['@id']
            additionalProperties: false
            properties:
              '@id':
                const: 'https://w3id.org/cdif/dde/1.0/DDEImage'
- $ref: ../../../DDEproperties/ddeImagery/schema.yaml
- type: object
  properties:
    schema:additionalType:
      contains:
        type: object
        properties:
          '@type':
            contains:
              const: schema:DefinedTerm
          schema:inDefinedTermSet:
            const: dde:codelist/ResourceTypeCode
          schema:termCode:
            type: string
            enum:
            - image
            - map
            - photograph
            - explanatoryFigure
        required:
        - '@type'
        - schema:inDefinedTermSet
        - schema:termCode
      minContains: 1
    schema:measurementTechnique:
      description: The technique, technology, or methodology used for measurement or determination of
        the dataset values.
      type: array
      items:
        anyOf:
        - type: string
        - $ref: '#/$defs/DefinedTerm'
    schema:variableMeasured:
      description: What does the dataset measure? (e.g., temperature, pressure)
      type: array
      items:
        anyOf:
        - $ref: '#/$defs/VariableMeasured'
        - $ref: '#/$defs/StatisticalVariable'
    schema:temporalCoverage:
      description: Temporal extent of resource content.
      type: array
      items:
        $ref: '#/$defs/TemporalExtent'
    dqv:hasQualityMeasurement:
      description: Quality measurements reported to assess the resource.
      type: array
      items:
        $ref: '#/$defs/QualityMeasure'
- if:
    properties:
      schema:additionalType:
        contains:
          type: object
          properties:
            schema:termCode:
              const: map
  then:
    $ref: ../../../DDEproperties/ddeGeographicDataset/schema.yaml
$defs:
  DefinedTerm:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/definedTerm/schema.yaml
  VariableMeasured:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/variableMeasured/schema.yaml
  StatisticalVariable:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/statisticalVariable/schema.yaml
  TemporalExtent:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/schemaorgProperties/temporalExtent/schema.yaml
  QualityMeasure:
    $ref: https://cross-domain-interoperability-framework.github.io/metadataBuildingBlocks/_sources/qualityProperties/qualityMeasure/schema.yaml
